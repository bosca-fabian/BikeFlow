# BikeFlow local stack.
#
#   docker compose up -d --build                 start everything (Kafka UI: http://localhost:8080)
#   docker compose logs -f                       see what it is doing
#   docker compose down                          stop (everything in ./data is kept)
#   docker compose run --rm spark python job.py  run your own code in the shared environment
#
# Inside containers: Kafka = kafka:19092, Redis = redis:6379, data = /app/data (lake = /app/data/lake).
# From your laptop:  Kafka = localhost:9092, Redis = localhost:6379, data = ./data.
name: bikeflow

x-app: &app
  build: .
  image: bikeflow-app:0.1
  env_file:
    - path: .env
      required: false
  environment: &app-env
    KAFKA_BOOTSTRAP: kafka:19092
    REDIS_URL: redis://redis:6379/0
    BIKEFLOW_DATA: /app/data
  # Files written to ./data belong to you, not root (Linux).
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  init: true
  volumes:
    - ${BIKEFLOW_DATA:-./data}:/app/data
  depends_on:
    kafka:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: "QmlrZUZsb3dDbHVzdGVyMQ"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 15s
      retries: 18
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Live Citi Bike feed every 60 s -> Kafka; raw recordings -> ./data/raw/station_status;
  # service alerts (every 5 min) and regions (daily) -> ./data/lake.
  producer:
    <<: *app
    command: ["bikeflow-ingest", "produce"]
    restart: unless-stopped

  # Kafka -> ./data/lake/station_status_raw.
  lake-sink:
    <<: *app
    command: ["bikeflow-ingest", "sink"]
    restart: unless-stopped
    stop_grace_period: 60s

  # Kafka `station_status` -> Spark Structured Streaming -> Redis: the live state of
  # every station, the empty/full alerts and the 30-minute warnings (docs/SPEED_LAYER.md).
  stream:
    <<: *app
    command: ["bikeflow-stream", "run"]
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4041:4040"

  # Streamlit dashboard: http://localhost:8501. The repo is mounted, so code edits show up on reload.
  dashboard:
    <<: *app
    working_dir: /app
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0",
              "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    volumes:
      - .:/app
      - ${BIKEFLOW_DATA:-./data}:/app/data
    ports:
      - "8501:8501"
    restart: unless-stopped

  # Shared environment for everyone's own code (Spark jobs, scripts, tests); the repo is mounted.
  spark:
    <<: *app
    profiles: ["jobs"]
    working_dir: /app
    volumes:
      - .:/app
      - ${BIKEFLOW_DATA:-./data}:/app/data
    ports:
      - "4040:4040"
    command: ["bash"]
    stdin_open: true
    tty: true
    restart: "no"

  kafka-ui:
    image: kafbat/kafka-ui:v1.0.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bikeflow
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  kafka-data:
  redis-data:
